name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ubuntu-tests:
    name: Python ${{ matrix.python-version }} (Ubuntu)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python -m py_compile winbar_monitor.py winbar.1m.py
      - name: Check shell syntax
        run: sh -n install.sh uninstall.sh

  macos-system-python:
    name: macOS system Python
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests with system Python
        run: /usr/bin/python3 -m unittest discover -s tests -v
      - name: Compile Python sources
        run: /usr/bin/python3 -m py_compile winbar_monitor.py winbar.1m.py
      - name: Check shell syntax
        run: sh -n install.sh uninstall.sh

  windows-collector:
    name: Windows PowerShell collector
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse Windows scripts
        shell: powershell
        run: |
          $errors = @()
          Get-ChildItem windows -Filter '*.ps1' | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            $errors += $parseErrors
          }
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }
      - name: Run one local collection
        shell: powershell
        run: |
          $dataDirectory = Join-Path $env:RUNNER_TEMP 'winbar-monitor'
          & .\windows\collect-winbar.ps1 -DataDirectory $dataDirectory -RetentionDays 1
          if (-not (Test-Path (Join-Path $dataDirectory 'latest.json'))) {
            throw 'Collector did not create latest.json.'
          }
