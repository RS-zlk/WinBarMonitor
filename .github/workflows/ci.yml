name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ubuntu-tests:
    name: Python ${{ matrix.python-version }} (Ubuntu)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Check shell syntax
        run: sh -n install.sh uninstall.sh winbar.1m.py

  macos-system-python:
    name: macOS system Python
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests with system Python
        run: /usr/bin/python3 -m unittest discover -s tests -v
      - name: Check shell syntax
        run: sh -n install.sh uninstall.sh winbar.1m.py
